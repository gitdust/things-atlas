<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 · 页面未找到 · 日常之物图志</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /*tokens*/
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.8 var(--font-sans);
      }
      main {
        width: min(100% - 40px, 600px);
        margin: 0 auto;
        padding: 48px 0;
      }
      .brand {
        color: var(--ink-3);
        font: 15px var(--font-serif);
        letter-spacing: 0.04em;
      }
      .code {
        margin: 36px 0 0;
        color: var(--accent);
        font: clamp(80px, 20vw, 128px)/1 var(--font-serif);
      }
      h1 {
        margin: 16px 0 8px;
        font: 500 clamp(25px, 6vw, 34px)/1.4 var(--font-serif);
      }
      p {
        margin: 0;
        color: var(--ink-3);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }
      .home {
        display: inline-block;
        margin: 24px 0 36px;
        padding: 10px 24px;
        background: var(--ink);
        color: var(--paper);
        border-radius: 4px;
      }
      .suggestion {
        border-top: 1px solid var(--rule-strong);
        padding-top: 24px;
      }
      .kicker {
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      .card {
        display: block;
        margin-top: 12px;
        padding: 24px;
        border: 1px solid var(--rule-strong);
        border-radius: 8px;
        background: var(--surface-note);
      }
      .card:hover {
        border-color: var(--accent);
      }
      h2 {
        margin: 8px 0 12px;
        font: 500 28px/1.4 var(--font-serif);
      }
      .year {
        font-size: 13px;
        color: var(--ink-3);
      }
      .explore {
        display: block;
        margin-top: 18px;
        color: var(--accent);
        font-size: 14px;
      }
      footer {
        margin-top: 28px;
        font-size: 12px;
        color: var(--ink-3);
      }
      @media (max-width: 480px) {
        main {
          padding-top: 28px;
        }
        .code {
          margin-top: 28px;
        }
        .card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">Things Atlas · 日常之物图志</a>
      <div class="code" aria-hidden="true">404</div>
      <h1>这一页，还没有坐标</h1>
      <p>页面不存在，或链接已经失效。回到地图，继续探索日常之物的起源。</p>
      <a class="home" href="/">返回主页 →</a>
      <section class="suggestion" aria-label="随机条目推荐">
        <p class="kicker">不妨从这件日常之物开始</p>
        <!--card-->
      </section>
      <footer>每件日常之物，都有一段值得发现的历史。</footer>
    </main>
    <script id="suggestions" type="application/json">
      /*items*/
    </script>
    <script>
      const items = JSON.parse(document.getElementById('suggestions').textContent);
      if (items.length) {
        const item = items[Math.floor(Math.random() * items.length)];
        const card = document.getElementById('suggested-item');
        card.href = item.path;
        document.getElementById('item-name').textContent = item.name;
        document.getElementById('item-year').textContent = item.year;
        document.getElementById('item-summary').textContent = item.summary;
      }
    </script>
  </body>
</html>
