<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo:start-->
    <title>Things Atlas · 日常之物图志</title>
    <meta
      name="description"
      content="Things Atlas / 日常之物图志 — pin everyday objects on a world map by invention, patent, mass production, and popularization years."
    />
    <!--seo:end-->
    <meta name="msvalidate.01" content="8A029EE99DC0803F900F4A1181852CA6" />
    <meta name="theme-color" content="#efe9dd" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- map tiles, style, glyphs and sprites all come from OpenFreeMap -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6279602726933755"
      crossorigin="anonymous"
    ></script>
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, 'clarity', 'script', 'zas8fs3rzj');
    </script>
    <style>
      #root[data-loading] > .app {
        visibility: hidden;
      }
      .ssr-stale body #root {
        visibility: visible;
      }
      .ssr-stale #root > .app {
        visibility: hidden;
      }
      .initial-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 18px;
        text-align: center;
        background: #efe9dd;
        color: #282722;
        font:
          14px Georgia,
          'Songti SC',
          serif;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .initial-loading svg {
        animation: loading-spin 3s linear infinite;
        width: 48px;
        height: 48px;
        margin: auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1;
      }
      .initial-loading p {
        margin: 0;
        letter-spacing: 0.08em;
      }
      .initial-loading small {
        opacity: 0.6;
        letter-spacing: 0.04em;
      }
    </style>
    <!--preload:fonts-->
    <script>
      // Only hydrate markup that matches the requested language and year.
      (function () {
        const params = new URLSearchParams(location.search);
        const lang = params.get('lang') === 'en' ? 'en' : 'zh';
        const year = params.get('y');
        if (
          lang !== '__SSR_LANG__' ||
          (year !== null && year !== '__DATA_MAX__') ||
          params.has('id')
        ) {
          document.documentElement.classList.add('ssr-stale');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" data-loading>
      <!--loading:start-->
      <div class="initial-loading" role="status" aria-live="polite">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="17.5" />
          <ellipse cx="20" cy="20" rx="7.5" ry="17.5" />
          <path d="M2.5 20h35M5 11.5h30M5 28.5h30" />
        </svg>
        <p>日常之物图志 · Things Atlas</p>
        <small>正在展开图志 · Loading the atlas…</small>
      </div>
      <!--loading:end--><!--app-html-->
    </div>
    <noscript
      ><style>
        #root[data-loading] > .app {
          visibility: visible;
        }
        .initial-loading {
          display: none;
        }
      </style></noscript
    >
    <!--noscript-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
