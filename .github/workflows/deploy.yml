name: deploy

# Production only. Other branches stay on validate.yml and are not published.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Require SITE_URL
        run: |
          test -n "$SITE_URL" || {
            echo "Set GitHub Actions variable SITE_URL to the public origin, e.g. https://atlas.example.com"
            exit 1
          }
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=things-atlas --branch=master
