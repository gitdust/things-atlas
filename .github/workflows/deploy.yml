name: deploy

# Production deploy. Build already runs data, font, and type checks.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run test:share
      - run: sudo apt-get install -y zbar-tools
      - run: npm run test:updates
      - run: npm run test:geo
      - run: npm run lint
      - run: npm run build
        env:
          SITE_URL: https://things-atlas.com
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - run: npm run test:share:assets -- --qr
      - name: Publish to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
